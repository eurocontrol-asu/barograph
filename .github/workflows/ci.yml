name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect workspace packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      all: ${{ steps.matrix.outputs.all }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/workspace-matrix
        id: matrix

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-groups --locked
      # Ruff + format + per-package mypy: the single source of truth is `make lint`.
      - run: make lint

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-groups --locked
      # Blocking: a vulnerability with genuinely no upstream fix gets named
      # here (`--ignore-vuln ...`) as a dated decision, never a blanket switch.
      - run: uv run pip-audit

  test:
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    name: Test ${{ matrix.package.name }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      # Exercise optional readers and the native pycontrails bridge in both
      # Python versions; otherwise those tests silently skip without the extra.
      - run: uv sync --all-packages --all-groups --all-extras --locked
      - name: Test package
        env:
          PACKAGE: ${{ matrix.package.name }}
          PACKAGE_DIR: ${{ matrix.package.path }}
        # -n auto is set here, not in the package addopts: parallelism is a
        # property of the CI run; a local `pytest` stays sequential.
        run: |
          uv run --package "$PACKAGE" --directory "$PACKAGE_DIR" pytest --cov -n auto
          # Enforce the package's configured threshold on the written data.
          uv run --package "$PACKAGE" --directory "$PACKAGE_DIR" coverage report
