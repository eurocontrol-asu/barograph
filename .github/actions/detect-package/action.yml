name: Detect package
description: Resolve the package a release tag designates and whether it may be published.
inputs:
  package:
    description: Package directory name for a manual build without a tag
    required: false
    default: ""
  tag:
    description: Tag to resolve; defaults to the pushed ref.
    required: false
    default: ""
outputs:
  package:
    description: Package name, taken from the tag prefix
    value: ${{ steps.detect.outputs.package }}
  package-dir:
    description: Package directory under packages/
    value: ${{ steps.detect.outputs.package-dir }}
  publishable:
    description: Whether the package allows external publication
    value: ${{ steps.detect.outputs.publishable }}
  version:
    description: Expected release version, empty for an untagged manual build
    value: ${{ steps.detect.outputs.version }}
  prerelease:
    description: Whether the detected version is a pre-release or development release
    value: ${{ steps.detect.outputs.prerelease }}
runs:
  using: composite
  steps:
    # The caller must have checked out the repository: detection reads the
    # package directory and its classifiers from the working tree.
    - id: detect
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_PACKAGE: ${{ inputs.package }}
      run: |
        TAG="$INPUT_TAG"
        if [ -z "$TAG" ] && [ -z "$INPUT_PACKAGE" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        python .github/scripts/release_ci.py detect --tag "$TAG" --package "$INPUT_PACKAGE"
