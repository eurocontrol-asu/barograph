[project]
name = "barograph-workspace"
version = "0.0.0"
requires-python = ">=3.12"
description = "barograph workspace — enrich aircraft trajectories, starting with weather at full model resolution"
license = "EUPL-1.2"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Gabriel Jarry", email = "gabriel.jarry@eurocontrol.int" }]
keywords = ["aviation", "ads-b", "era5", "arpege", "weather", "trajectory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["barograph-met[grib,pandas,openmeteo]"]

[project.urls]
Homepage = "https://github.com/eurocontrol-asu/barograph"
Repository = "https://github.com/eurocontrol-asu/barograph"
Documentation = "https://eurocontrol-asu.github.io/barograph/"

[dependency-groups]
dev = [
    "prek>=0.5.4",
    "ruff>=0.16.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pandas-stubs>=2.0",
]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocs-monorepo-plugin>=1.1",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
]
quality = [
    "axm-audit>=0.12",
    "axm-init>=0.17",
]

[tool.uv]
package = false
required-version = ">=0.9"
# The tools whose version IS the CI verdict are pinned once here; members only
# declare a floor (same policy as the axm workspaces).
constraint-dependencies = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "prek==0.5.4",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
barograph-met = { workspace = true }

[tool.pytest.ini_options]
# Replicated from the member configs: a ROOT run is driven by this file.
import_mode = "importlib"
testpaths = ["packages/barograph-met/tests_barograph_met"]
pythonpath = ["packages/barograph-met/src", "packages/barograph-met/tests_barograph_met"]
addopts = ["--import-mode=importlib", "-m", "not live"]
markers = [
    "integration: real I/O against local stores or mirrors",
    "e2e: end-to-end subprocess tests",
    "live: downloads from public buckets (opt-in: -m live)",
]

[tool.ruff]
extend-exclude = ["*.md"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE", "C4", "C901", "PLR", "S", "T20", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# CI helper copied from the axm workspaces: prints the matrix and calls git.
".github/scripts/*" = ["S603", "S607", "T201", "PLR2004"]
